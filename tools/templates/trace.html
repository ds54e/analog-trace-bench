<main class="page-shell">
<article class="document-page">
<header class="document-header">
<h1>$task / <span class="title-model">$model</span></h1>
</header>
<div aria-label="Trial" class="run-tabs" data-run-tabs="" role="tablist">
$tabs
</div>
<div aria-labelledby="run-tab-$run" class="run-panel" id="run-panel-$run" role="tabpanel">
<section aria-label="Run summary" class="run-summary" id="run-$run-summary">
<table class="summary-table">
$summary
</table>
</section>
<section aria-label="Design trace" class="run-trace" id="run-$run-trace">
$trace
</section>
</div>
$empty_panels
</article>
</main>
